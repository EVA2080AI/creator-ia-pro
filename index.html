<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Creator IA Pro — Hub de IA Generativa</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fuentes: preconnect + hoja propia (antes iban en un @import dentro de
         src/index.css, que encadena las peticiones en vez de paralelizarlas).
         Pesos recortados a los que el diseño usa de verdad: Inter variable para el
         texto, Outfit para los títulos y JetBrains Mono para el modo terminal. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Creator IA" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Creator IA Pro: hub multi-modelo con DeepSeek, Gemini, Claude y Nano Banana. Genera, mejora y escala imágenes con IA. Sistema de créditos flexible.">
    <meta name="author" content="Creator IA Pro" />
    <meta property="og:title" content="Creator IA Pro — Hub de IA Generativa">
    <meta property="og:description" content="Hub multi-modelo con DeepSeek, Gemini, Claude y Nano Banana. Sistema de créditos dinámico y herramientas profesionales de IA.">
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Creator IA Pro — Hub de IA Generativa">
    <meta name="twitter:description" content="Hub multi-modelo con DeepSeek, Gemini, Claude y Nano Banana.">
    <!-- Open Graph Image -->
    <meta property="og:image" content="https://creator-ia.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://creator-ia.com/og-image.png" />
    <!-- Apply dark mode class before first paint to avoid a light-mode flash.
         Mirrors the logic in src/hooks/useTheme.tsx (localStorage key "theme",
         values "light" | "dark" | "system", default "system"). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0d0d0f');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
