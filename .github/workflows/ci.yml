name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Type check API
        run: npm run typecheck:api

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  # Sin jobs de deploy: el proyecto de Vercel está conectado por Git
  # directamente (ver .vercel/project.json) y despliega preview/producción
  # solo con el push — no hace falta duplicarlo acá. Los dos jobs que había
  # (deploy-preview/deploy-production) usaban `vercel/action-deploy@v1`, una
  # Action que no existe en el marketplace; nunca llegaron a desplegar nada,
  # solo dejaban el pipeline en rojo después de que lint/test pasaran.
