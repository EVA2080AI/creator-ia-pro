<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Misma marca que src/components/Logo.tsx: tile oscuro, "C" de anillo grueso
       abierto a la derecha y el punto morado de la marca en la apertura.
       (El favicon anterior era un tile AZUL con sparkles genéricos: tercera
       identidad distinta conviviendo con las otras dos.) -->
  <rect width="32" height="32" rx="9" fill="#18181B"/>
  <circle cx="16" cy="16" r="8.5" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="38.6 53.4" transform="rotate(50 16 16)"/>
  <circle cx="24.5" cy="16" r="3" fill="#A855F7"/>
</svg>
